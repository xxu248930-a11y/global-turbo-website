
name: Build Product and Brand Index

on:
  push:
    branches:
      - main
    paths:
      - 'products/**'
      - 'brands/**'
      - 'cummins-products/**'
      - 'engine-parts/**'
      - 'machinery-parts/**'
      - 'machinery-categories/**'
      - '.github/workflows/build-product-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate all product and category indexes
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function scanJson(dir, callback) {
            if (!fs.existsSync(dir)) return;

            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, item.name);

              if (item.isDirectory()) {
                scanJson(file, callback);
              } else if (item.isFile() && item.name.endsWith(".json")) {
                try {
                  const data = JSON.parse(fs.readFileSync(file, "utf8"));

                  if (data && typeof data === "object" && !Array.isArray(data)) {
                    callback(data, file);
                  }
                } catch (error) {
                  console.log("Skipped invalid JSON:", file);
                }
              }
            }
          }

          function generateIndex(directory, outputFile, label) {
            const items = [];

            scanJson(directory, (data, file) => {
              items.push(data);
              console.log("Added " + label + ":", file);
            });

            fs.writeFileSync(
              outputFile,
              JSON.stringify(items, null, 2) + "\n"
            );

            console.log("TOTAL " + label + ":", items.length);
          }

          // 1. Original turbochargers and products
          generateIndex("products", "products-index.json", "PRODUCTS");

          // 2. Brands
          const brands = [];

          scanJson("brands", (data, file) => {
            if (typeof data.name === "string" && data.name.trim()) {
              brands.push(data);
              console.log("Added brand:", data.name);
            }
          });

          fs.writeFileSync(
            "brands-index.json",
            JSON.stringify(brands, null, 2) + "\n"
          );

          console.log("TOTAL BRANDS:", brands.length);

          // 3. Cummins engines
          generateIndex(
            "cummins-products",
            "cummins-products-index.json",
            "CUMMINS PRODUCTS"
          );

          // 4. Engine parts
          generateIndex(
            "engine-parts",
            "engine-parts-index.json",
            "ENGINE PARTS"
          );

          // 5. Construction machinery parts
          generateIndex(
            "machinery-parts",
            "machinery-parts-index.json",
            "MACHINERY PARTS"
          );

          // 6. Construction machinery categories
          // Add the actual category file path to every category record.
          const machineryCategories = [];

          scanJson("machinery-categories", (data, file) => {
            machineryCategories.push({
              ...data,
              category_file: file.replace(/\\/g, "/")
            });

            console.log("Added MACHINERY CATEGORY:", file);
          });

          fs.writeFileSync(
            "machinery-categories-index.json",
            JSON.stringify(machineryCategories, null, 2) + "\n"
          );

          console.log(
            "TOTAL MACHINERY CATEGORIES:",
            machineryCategories.length
          );
          NODE

      - name: Save generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f products-index.json
          git add -f brands-index.json
          git add -f cummins-products-index.json
          git add -f engine-parts-index.json
          git add -f machinery-parts-index.json
          git add -f machinery-categories-index.json

          if git diff --cached --quiet; then
            echo "Indexes are already up to date."
          else
            git commit -m "Automatically update all product and category indexes"
            git push
          fi

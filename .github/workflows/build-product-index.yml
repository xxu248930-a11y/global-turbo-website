
name: Build Product and Brand Index

on:
  push:
    branches:
      - main
    paths:
      - 'products/**'
      - 'brands/**'
      - 'cummins-products/**'
      - 'engine-parts/**'
      - 'engine-categories/**'
      - 'machinery-parts/**'
      - 'machinery-categories/**'
      - 'homepage-categories/**'
      - 'homepage-subcategories/**'
      - 'general-products/**'
      - '.github/workflows/build-product-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-product-index-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate all product and category indexes
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          function scanJson(dir, callback) {
            if (!fs.existsSync(dir)) return;

            for (const item of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, item.name);

              if (item.isDirectory()) {
                scanJson(file, callback);
              } else if (item.isFile() && item.name.endsWith(".json")) {
                try {
                  const data = JSON.parse(fs.readFileSync(file, "utf8"));

                  if (data && typeof data === "object" && !Array.isArray(data)) {
                    callback(data, file);
                  }
                } catch (error) {
                  console.log("Skipped invalid JSON:", file);
                }
              }
            }
          }

          function generateIndex(directory, outputFile, label) {
            const items = [];

            scanJson(directory, (data, file) => {
              items.push(data);
              console.log("Added " + label + ":", file);
            });

            fs.writeFileSync(
              outputFile,
              JSON.stringify(items, null, 2) + "\n"
            );

            console.log("TOTAL " + label + ":", items.length);
          }

          function generateCategoryIndex(directory, outputFile, label) {
            const items = [];

            scanJson(directory, (data, file) => {
              items.push({
                ...data,
                category_file: file.replace(/\\/g, "/")
              });

              console.log("Added " + label + ":", file);
            });

            fs.writeFileSync(
              outputFile,
              JSON.stringify(items, null, 2) + "\n"
            );

            console.log("TOTAL " + label + ":", items.length);
          }

          generateIndex("products", "products-index.json", "PRODUCTS");

          const brands = [];
          scanJson("brands", (data, file) => {
            if (typeof data.name === "string" && data.name.trim()) {
              brands.push(data);
              console.log("Added brand:", data.name);
            }
          });

          fs.writeFileSync("brands-index.json", JSON.stringify(brands, null, 2) + "\n");
          console.log("TOTAL BRANDS:", brands.length);

          generateIndex("cummins-products", "cummins-products-index.json", "CUMMINS PRODUCTS");
          generateIndex("engine-parts", "engine-parts-index.json", "ENGINE PARTS");
          generateIndex("machinery-parts", "machinery-parts-index.json", "MACHINERY PARTS");

          generateCategoryIndex("engine-categories", "engine-categories-index.json", "ENGINE CATEGORIES");
          generateCategoryIndex("machinery-categories", "machinery-categories-index.json", "MACHINERY CATEGORIES");
          generateCategoryIndex("homepage-categories", "homepage-categories-index.json", "HOMEPAGE CATEGORIES");
          generateCategoryIndex("homepage-subcategories", "homepage-subcategories-index.json", "HOMEPAGE SUBCATEGORIES");

          generateIndex("general-products", "general-products-index.json", "GENERAL PRODUCTS");
          NODE

      - name: Save generated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f products-index.json
          git add -f brands-index.json
          git add -f cummins-products-index.json
          git add -f engine-parts-index.json
          git add -f engine-categories-index.json
          git add -f machinery-parts-index.json
          git add -f machinery-categories-index.json
          git add -f homepage-categories-index.json
          git add -f homepage-subcategories-index.json
          git add -f general-products-index.json

          if git diff --cached --quiet; then
            echo "Indexes are already up to date."
            exit 0
          fi

          git commit -m "Automatically update all product and category indexes"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Indexes pushed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed. Retrying..."
            sleep 2
          done

          echo "Unable to push indexes after 5 attempts."
          exit 1

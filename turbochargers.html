
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turbochargers | Global Turbo Supplier</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    header {
      background: #171717;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    header a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }
    .container {
      max-width: 1100px;
      margin: 45px auto;
      padding: 0 20px;
    }
    h1 { text-align: center; }
    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }
    .brands {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }
    .brand {
      display: block;
      background: white;
      padding: 35px 20px;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      color: #222;
      border: 1px solid #eee;
      transition: transform .2s;
    }
    .brand:hover { transform: translateY(-5px); }
    .brand h2 { color: #b82027; }
    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <strong>GLOBAL TURBO SUPPLIER</strong>
    <nav>
      <a href="index.html">Home</a >
      <a href="turbochargers.html">Turbochargers</a >
      <a href="https://wa.me/8617377554610" target="_blank" rel="noopener">Contact Us</a >
    </nav>
  </header>

  <main class="container">
    <h1>Turbocharger Brands</h1>
    <p class="intro">Choose a brand to explore our turbocharger products.</p >

    
<
<div class="brands" id="brand-list">
  <p>Loading brands...</p >
</div>

<script>
fetch("/brands-index.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Brand index not found");
    }
    return response.json();
  })
  .then(brands => {
    const list = document.getElementById("brand-list");
    list.innerHTML = "";

    if (!Array.isArray(brands) || brands.length === 0) {
      list.innerHTML = "<p>No brands available.</p >";
      return;
    }

    brands.forEach(brand => {
      const card = document.createElement("a");
      card.className = "brand";
      card.href = "brand.html?name=" + encodeURIComponent(brand.name);

      const title = document.createElement("h2");
      title.textContent = brand.name;

      const description = document.createElement("p");
      description.textContent = brand.description || "Turbochargers and Parts";

      card.appendChild(title);
      card.appendChild(description);
      list.appendChild(card);
    });
  })
  .catch(error => {
    console.error("Brand loading error:", error);
    document.getElementById("brand-list").innerHTML =
      "<p>Unable to load brands. Please try again later.</p >";
  });
</script>

  </main>

  <footer>Global Turbo Supplier | Worldwide Export</footer>
</body>
</html>

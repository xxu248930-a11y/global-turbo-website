
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>All Products | Global Turbocharger & Engine Supplier</title>
<meta name="description" content="Explore our complete range of turbochargers, Cummins engines, engine parts and construction machinery parts.">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f6f7f9;
  color: #252525;
}

header {
  background: #17212b;
  padding: 18px 5%;
}

nav {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  flex-wrap: wrap;
  gap: 28px;
}

nav a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 15px;
}

nav a:hover {
  color: #e34b4b;
}

.hero {
  background: #263746;
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.hero h1 {
  font-size: 34px;
  margin-bottom: 12px;
}

.hero p {
  color: #dce3e9;
  font-size: 15px;
}

.container {
  max-width: 1250px;
  margin: 35px auto;
  padding: 0 20px;
}

.toolbar {
  background: white;
  padding: 22px;
  border-radius: 10px;
  margin-bottom: 25px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}

.search-box {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 15px;
  margin-bottom: 15px;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.filters select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 6px;
  background: white;
  font-size: 14px;
}

.result-info {
  margin: 18px 0;
  color: #666;
  font-size: 14px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.product-card {
  background: white;
  border: 1px solid #eee;
  border-radius: 9px;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}

.product-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 18px rgba(0,0,0,.09);
}

.image-area {
  width: 100%;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.no-image {
  color: #999;
  font-size: 14px;
}

.product-info {
  padding: 16px;
}

.product-category {
  display: inline-block;
  background: #f1f2f4;
  color: #666;
  padding: 4px 9px;
  border-radius: 4px;
  font-size: 11px;
  margin-bottom: 9px;
}

.product-info h3 {
  font-size: 17px;
  margin-bottom: 10px;
  color: #202b35;
  overflow-wrap: anywhere;
}

.product-info p {
  font-size: 13px;
  color: #666;
  margin: 6px 0;
  overflow-wrap: anywhere;
}

.product-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.product-buttons a {
  flex: 1;
  display: block;
  text-align: center;
  padding: 11px 5px;
  border-radius: 5px;
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
}

.details-button {
  background: #ffffff;
  color: #bd252e;
  border: 1px solid #bd252e;
}

.details-button:hover {
  background: #bd252e;
  color: white;
}

.quote-button {
  background: #bd252e;
  color: white;
  border: 1px solid #bd252e;
}

.quote-button:hover {
  background: #991c24;
  border-color: #991c24;
}

.empty {
  grid-column: 1 / -1;
  background: white;
  padding: 45px 20px;
  text-align: center;
  color: #777;
  border-radius: 8px;
}

footer {
  background: #17212b;
  color: #bbb;
  text-align: center;
  padding: 25px;
  margin-top: 55px;
  font-size: 13px;
}

@media (max-width: 768px) {
  nav {
    justify-content: center;
    gap: 16px;
  }

  .hero h1 {
    font-size: 27px;
  }

  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .product-info {
    padding: 11px;
  }

  .product-info h3 {
    font-size: 14px;
  }

  .product-info p {
    font-size: 12px;
  }

  .product-buttons {
    flex-direction: column;
    gap: 7px;
  }

  .product-buttons a {
    font-size: 12px;
    padding: 10px 5px;
  }

  .filters {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href=" ">Home</a >
    <a href="all-products.html">Products</a >
    <a href="about.html">About Us</a >
    <a href="https://wa.me/8617377554610" target="_blank" rel="noopener">Contact</a >
  </nav>
</header>

<section class="hero">
  <h1>All Products</h1>
  <p>Turbochargers, Engines, Engine Parts & Machinery Parts</p >
</section>

<main class="container">

  <section class="toolbar">

    <input
      type="search"
      id="product-search"
      class="search-box"
      placeholder="Search product name, model, OEM or part number..."
    >

    <div class="filters">

      <select id="category-filter">
        <option value="">All Product Types</option>
      </select>

      <select id="brand-filter">
        <option value="">All Brands</option>
      </select>

    </div>

  </section>

  <div class="result-info" id="result-info">
    Loading products...
  </div>

  <section class="product-grid" id="product-list">
    <div class="empty">Loading products...</div>
  </section>

</main>

<footer>
  © 2026 Global Turbocharger Supplier. All Rights Reserved.
</footer>

<script>
const list = document.getElementById("product-list");
const searchInput = document.getElementById("product-search");
const categoryFilter = document.getElementById("category-filter");
const brandFilter = document.getElementById("brand-filter");
const resultInfo = document.getElementById("result-info");

let allProducts = [];

const productSources = [
  {
    file: "products-index.json",
    type: "turbo",
    label: "Turbochargers & Parts"
  },
  {
    file: "cummins-products-index.json",
    type: "cummins",
    label: "Cummins Engines"
  },
  {
    file: "engine-parts-index.json",
    type: "engine-part",
    label: "Engine Parts"
  },
  {
    file: "machinery-parts-index.json",
    type: "machinery-part",
    label: "Machinery Parts"
  }
];

function normalize(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[\s\-_.\/\\]+/g, "")
    .replace(/[^\p{L}\p{N}]/gu, "");
}

function normalizeBrand(value) {
  if (typeof value === "object" && value !== null) {
    value = value.name || value.value || value.path || "";
  }

  return String(value || "")
    .trim()
    .replace(/\\/g, "/")
    .split("/")
    .pop()
    .replace(/\.json$/i, "");
}

function getCategory(product) {
  return product.productTypeLabel ||
    product.category ||
    product.product_category ||
    "Turbochargers";
}

function getBrand(product) {
  if (product.productType === "cummins") {
    return "Cummins";
  }

  return normalizeBrand(product.brand) || "Contact us";
}

function getImage(product) {
  return product.image ||
    (Array.isArray(product.images) ? product.images[0] : "") ||
    "";
}

function getSearchText(product) {
  return normalize(JSON.stringify(product));
}

function createCard(product) {
  const card = document.createElement("article");
  card.className = "product-card";

  const imageArea = document.createElement("div");
  imageArea.className = "image-area";

  const imagePath = getImage(product);

  if (imagePath) {
    const img = document.createElement("img");
    img.src = imagePath;
    img.alt = product.name || product.model || "Product";
    img.loading = "lazy";

    img.onerror = function () {
      imageArea.innerHTML =
        '<div class="no-image">Image unavailable</div>';
    };

    imageArea.appendChild(img);
  } else {
    imageArea.innerHTML =
      '<div class="no-image">No product image</div>';
  }

  const info = document.createElement("div");
  info.className = "product-info";

  const category = document.createElement("span");
  category.className = "product-category";
  category.textContent = getCategory(product);

  const title = document.createElement("h3");
  title.textContent =
    product.name || product.model || "Product";

  const brand = document.createElement("p");
  brand.textContent = "Brand: " + getBrand(product);

  const modelValue = product.model ||
    product.machine_model ||
    product.series ||
    "Contact us";

  const model = document.createElement("p");
  model.textContent = "Model: " + modelValue;

  const oem = document.createElement("p");
  oem.textContent = "OEM: " + (product.oem || "Contact us");

  const details = document.createElement("a");
  details.className = "details-button";

  const productName = product.name || product.model || "";

  details.href =
    "product-details.html?type=" +
    encodeURIComponent(product.productType) +
    "&name=" +
    encodeURIComponent(productName);

  details.textContent = "View Details";

  const quote = document.createElement("a");
  quote.className = "quote-button";

  const inquiryName = product.name || product.model || "this product";

  quote.href =
    "https://wa.me/" +
    String(product.whatsapp || "8617377554610").replace(/\D/g, "") +
    "?text=" +
    encodeURIComponent("I am interested in " + inquiryName);

  quote.target = "_blank";
  quote.rel = "noopener";
  quote.textContent = "Request a Quote";

  const buttons = document.createElement("div");
  buttons.className = "product-buttons";
  buttons.append(details, quote);

  info.append(
    category,
    title,
    brand,
    model,
    oem,
    buttons
  );

  card.append(imageArea, info);

  return card;
}

function populateFilters() {
  categoryFilter.innerHTML =
    '<option value="">All Product Types</option>';

  brandFilter.innerHTML =
    '<option value="">All Brands</option>';

  const categories = [...new Set(
    allProducts.map(getCategory).filter(Boolean)
  )].sort();

  const brands = [...new Set(
    allProducts.map(getBrand).filter(Boolean)
  )].sort();

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    categoryFilter.appendChild(option);
  });

  brands.forEach(brand => {
    const option = document.createElement("option");
    option.value = brand;
    option.textContent = brand;
    brandFilter.appendChild(option);
  });
}

function renderProducts() {
  const keyword = normalize(searchInput.value);
  const selectedCategory = categoryFilter.value;
  const selectedBrand = brandFilter.value;

  const filtered = allProducts.filter(product => {
    const matchesSearch =
      !keyword || getSearchText(product).includes(keyword);

    const matchesCategory =
      !selectedCategory ||
      getCategory(product) === selectedCategory;

    const matchesBrand =
      !selectedBrand ||
      getBrand(product) === selectedBrand;

    return matchesSearch && matchesCategory && matchesBrand;
  });

  list.innerHTML = "";

  resultInfo.textContent =
    "Showing " + filtered.length + " of " +
    allProducts.length + " products";

  if (filtered.length === 0) {
    list.innerHTML =
      '<div class="empty">No matching products found.</div>';
    return;
  }

  filtered.forEach(product => {
    list.appendChild(createCard(product));
  });
}

async function loadAllProducts() {
  const results = await Promise.all(
    productSources.map(async source => {
      const response = await fetch(source.file);

      if (!response.ok) {
        throw new Error("Unable to load " + source.file);
      }

      const products = await response.json();

      if (!Array.isArray(products)) {
        throw new Error("Invalid product index: " + source.file);
      }

      return products.map(product => ({
        ...product,
        productType: source.type,
        productTypeLabel: source.label
      }));
    })
  );

  allProducts = results.flat();

  populateFilters();
  renderProducts();
}

searchInput.addEventListener("input", renderProducts);
categoryFilter.addEventListener("change", renderProducts);
brandFilter.addEventListener("change", renderProducts);

loadAllProducts().catch(error => {
  console.error("Product loading error:", error);

  resultInfo.textContent = "Products could not be loaded.";

  list.innerHTML =
    '<div class="empty">' +
    'Unable to load all product indexes. Please check the index files.' +
    '</div>';
});
</script>

</body>
</html>

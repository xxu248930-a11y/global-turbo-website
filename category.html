
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Category | Global Turbo</title>
<meta name="description" content="Browse diesel engine, turbocharger and machinery parts by category.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;color:#222;background:#f7f7f7;line-height:1.6}

header{
  background:#171717;
  color:#fff;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px
}

.logo{font-size:21px;font-weight:bold}
.logo span{color:#e52b32}
nav a{color:white;text-decoration:none;margin-left:18px;font-size:14px}

.hero{
  background:linear-gradient(120deg,#171717,#4a1719);
  color:#fff;
  padding:55px 6%
}
.hero h1{font-size:clamp(28px,5vw,42px);line-height:1.2}
.hero p{color:#ddd;margin-top:12px;max-width:750px}

main{padding:35px 6%;max-width:1400px;margin:auto}

.subcategories{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:18px;
  margin:18px 0 30px
}

.subcategory-card{
  border:1px solid #eee;
  background:#fff;
  border-radius:9px;
  overflow:hidden;
  cursor:pointer;
  text-align:left;
  color:#333;
  transition:transform .2s,box-shadow .2s;
  min-width:0
}

.subcategory-card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 18px rgba(0,0,0,.1)
}

.subcategory-card.active{
  border:2px solid #bd2029;
}

.subcategory-image{
  width:100%;
  aspect-ratio:4 / 3;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.subcategory-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center
}

.subcategory-image.no-image{
  color:#999;
  font-size:13px;
  text-align:center;
  padding:10px
}

.subcategory-name{
  display:block;
  padding:13px 12px;
  font-size:15px;
  font-weight:bold;
  overflow-wrap:anywhere
}

.all-products-btn{
  border:1px solid #ddd;
  background:#fff;
  padding:10px 18px;
  border-radius:5px;
  cursor:pointer;
  color:#333;
  margin-bottom:15px
}

.all-products-btn.active{
  background:#bd2029;
  color:#fff;
  border-color:#bd2029
}

.search-box{
  width:100%;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:6px;
  font-size:15px;
  margin-bottom:25px
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  align-items:stretch
}

.product{
  background:#fff;
  border:1px solid #eee;
  border-radius:8px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0
}

.product-image{
  width:100%;
  aspect-ratio:1 / 1;
  background:#fff;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.product-image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  background:#fff
}

.product-image.no-image{background:#fff}

.product-info{
  padding:16px;
  display:flex;
  flex-direction:column;
  flex:1
}

.product-info h3{
  font-size:17px;
  margin-bottom:9px;
  overflow-wrap:anywhere
}

.product-info p{
  font-size:14px;
  color:#666;
  margin-bottom:6px;
  overflow-wrap:anywhere
}

.product-info a{
  display:inline-block;
  color:#bd2029;
  font-weight:bold;
  text-decoration:none;
  margin-top:auto;
  padding-top:12px
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  color:#777;
  background:#fff;
  border-radius:8px
}

.section-heading{margin-bottom:15px}
.section-heading h2{font-size:24px}

footer{
  background:#151515;
  color:#bbb;
  text-align:center;
  padding:24px;
  font-size:13px
}

@media(max-width:600px){
  header{display:block}
  nav{margin-top:12px}
  nav a{margin:0 12px 0 0}
  main{padding:25px 4%}

  .subcategories{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
  }

  .subcategory-name{
    padding:10px;
    font-size:14px
  }

  .products{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
  }

  .product-image{
    aspect-ratio:1 / 1;
    padding:8px
  }

  .product-info{padding:11px}
  .product-info h3{font-size:15px}
}
</style>
</head>

<body>

<header>
  <div class="logo">GLOBAL <span>TURBO</span></div>
  <nav>
    <a href=" ">Home</a >
    <a href="all-products.html">All Products</a >
    <a href="https://wa.me/8617377554610" target="_blank" rel="noopener">Contact Us</a >
  </nav>
</header>

<div class="hero">
  <h1 id="category-title">Product Category</h1>
  <p id="category-description">Browse our products by category.</p >
</div>

<main>
  <section>
    <div class="section-heading">
      <h2>Product Subcategories</h2>
    </div>

    <button type="button" class="all-products-btn active" id="all-products-btn">
      All Products
    </button>

    <div class="subcategories" id="subcategory-list">
      <div class="empty">Loading subcategories...</div>
    </div>
  </section>

  <section>
    <div class="section-heading">
      <h2 id="products-heading">Products</h2>
    </div>

    <input
      type="search"
      class="search-box"
      id="product-search"
      placeholder="Search product name, brand, model or OEM..."
    >

    <div class="products" id="product-list">
      <div class="empty">Loading products...</div>
    </div>
  </section>
</main>

<footer>© 2026 Global Turbo & Engine Parts Supplier. All Rights Reserved.</footer>

<script>
const params = new URLSearchParams(window.location.search);
const currentSlug = String(params.get("slug") || "").trim();

let currentCategory = null;
let allProducts = [];
let allSubcategories = [];
let selectedSubcategory = "all";

function normalizePath(value) {
  return String(value || "")
    .trim()
    .replace(/\\/g, "/")
    .replace(/^\/+/, "");
}

function showProductMessage(message) {
  document.getElementById("product-list").innerHTML =
    '<div class="empty">' + message + '</div>';
}

function getSearchText(product) {
  const fields = [
    product.name,
    product.brand,
    product.model,
    product.oem,
    product.reference_numbers,
    product.interchange_numbers,
    product.applications,
    product.machine_models,
    product.engine_models
  ];

  return fields.map(value => {
    if (Array.isArray(value)) return value.join(" ");
    return String(value || "");
  }).join(" ").toLowerCase();
}

function renderSubcategories() {
  const list = document.getElementById("subcategory-list");
  const allButton = document.getElementById("all-products-btn");

  list.innerHTML = "";

  allButton.classList.toggle(
    "active",
    selectedSubcategory === "all"
  );

  allSubcategories.forEach(subcategory => {
    const categoryPath = normalizePath(subcategory.category_file);

    const card = document.createElement("button");
    card.type = "button";
    card.className =
      "subcategory-card" +
      (selectedSubcategory === categoryPath ? " active" : "");

    const imageBox = document.createElement("div");
    imageBox.className = "subcategory-image";

    const imagePath = String(subcategory.image || "").trim();

    if (imagePath) {
      const img = document.createElement("img");
      img.src = imagePath;
      img.alt = subcategory.name || "Subcategory";
      img.loading = "lazy";

      img.onerror = function() {
        this.remove();
        imageBox.classList.add("no-image");
        imageBox.textContent = "Image unavailable";
      };

      imageBox.appendChild(img);
    } else {
      imageBox.classList.add("no-image");
      imageBox.textContent = "No image";
    }

    const name = document.createElement("span");
    name.className = "subcategory-name";
    name.textContent = subcategory.name || "Subcategory";

    card.append(imageBox, name);

    card.onclick = function() {
      selectedSubcategory = categoryPath;
      renderSubcategories();
      renderProducts();
    };

    list.appendChild(card);
  });

  if (allSubcategories.length === 0) {
    list.innerHTML =
      '<div class="empty">No subcategories available.</div>';
  }
}

function renderProducts() {
  const list = document.getElementById("product-list");
  const keyword = document.getElementById("product-search").value
    .trim().toLowerCase();

  const filtered = allProducts.filter(product => {
    const productSubcategory = normalizePath(product.subcategory);

    const matchesSubcategory =
      selectedSubcategory === "all" ||
      productSubcategory === selectedSubcategory;

    const matchesSearch =
      !keyword || getSearchText(product).includes(keyword);

    return matchesSubcategory && matchesSearch;
  });

  list.innerHTML = "";

  if (!filtered.length) {
    showProductMessage("No products found in this category.");
    return;
  }

  filtered.forEach(product => {
    const card = document.createElement("div");
    card.className = "product";

    const imageBox = document.createElement("div");
    imageBox.className = "product-image";

    const imagePath = String(product.image || "").trim();

    if (imagePath) {
      const img = document.createElement("img");
      img.src = imagePath;
      img.alt = product.name || "Product";
      img.loading = "lazy";

      img.onerror = function() {
        this.remove();
        imageBox.classList.add("no-image");
      };

      imageBox.appendChild(img);
    } else {
      imageBox.classList.add("no-image");
    }

    card.appendChild(imageBox);

    const info = document.createElement("div");
    info.className = "product-info";

    const title = document.createElement("h3");
    title.textContent = product.name || "Product";

    info.appendChild(title);

    const fields = [
      ["Brand", product.brand],
      ["Model", product.model],
      ["OEM", product.oem]
    ];

    fields.forEach(([label, value]) => {
      if (value) {
        const p = document.createElement("p");
        p.textContent = label + ": " + String(value).trim();
        info.appendChild(p);
      }
    });

    const detailLink = document.createElement("a");
    detailLink.href =
      "product-details.html?type=general-product&name=" +
      encodeURIComponent(product.name || "");
    detailLink.textContent = "View Details";

    info.appendChild(detailLink);
    card.appendChild(info);
    list.appendChild(card);
  });
}

async function loadCategoryPage() {
  if (!currentSlug) {
    document.getElementById("category-title").textContent =
      "Category Not Specified";
    document.getElementById("category-description").textContent =
      "Please select a product category from the homepage.";
    document.getElementById("subcategory-list").innerHTML = "";
    showProductMessage("No category was specified.");
    return;
  }

  try {
    const [categoryResponse, subcategoryResponse, productResponse] =
      await Promise.all([
        fetch("/homepage-categories-index.json"),
        fetch("/homepage-subcategories-index.json"),
        fetch("/general-products-index.json")
      ]);

    if (!categoryResponse.ok ||
        !subcategoryResponse.ok ||
        !productResponse.ok) {
      throw new Error("One or more category data files could not be loaded.");
    }

    const [categories, subcategories, products] = await Promise.all([
      categoryResponse.json(),
      subcategoryResponse.json(),
      productResponse.json()
    ]);

    if (!Array.isArray(categories) ||
        !Array.isArray(subcategories) ||
        !Array.isArray(products)) {
      throw new Error("Invalid category data format.");
    }

    currentCategory = categories.find(category =>
      String(category.slug || "").trim() === currentSlug
    );

    if (!currentCategory) {
      document.getElementById("category-title").textContent =
        "Category Not Found";
      document.getElementById("category-description").textContent =
        "This category does not exist or is unavailable.";
      document.getElementById("subcategory-list").innerHTML = "";
      showProductMessage("Category not found.");
      return;
    }

    document.title = currentCategory.name + " | Global Turbo";
    document.getElementById("category-title").textContent =
      currentCategory.name || "Product Category";
    document.getElementById("category-description").textContent =
      currentCategory.description || "Browse products in this category.";

    const mainCategoryPath = normalizePath(currentCategory.category_file);

    allSubcategories = subcategories.filter(subcategory =>
      normalizePath(subcategory.main_category) === mainCategoryPath
    );

    allProducts = products.filter(product =>
      normalizePath(product.main_category) === mainCategoryPath
    );

    renderSubcategories();
    renderProducts();

  } catch (error) {
    console.error("Category page loading error:", error);
    document.getElementById("category-title").textContent =
      "Unable to Load Category";
    document.getElementById("category-description").textContent =
      "Please try again later.";
    document.getElementById("subcategory-list").innerHTML = "";
    showProductMessage("Category data is temporarily unavailable.");
  }
}

document.getElementById("all-products-btn").addEventListener("click", function() {
  selectedSubcategory = "all";
  renderSubcategories();
  renderProducts();
});

document.getElementById("product-search").addEventListener("input", function() {
  renderProducts();
});

loadCategoryPage();
</script>

<script src="/watermark.js" defer></script>
<script src="/image-adjust.js" defer></script>

</body>
</html>

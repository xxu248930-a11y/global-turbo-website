
media:
  input: media
  output: /media

content:
  - name: products
    label: Products
    type: collection
    path: products
    filename: "{primary}.json"
    format: json
    fields:
      - name: name
        label: Product Name
        type: string
        required: true
      - name: brand
        label: Brand
        type: select
        options:
          values:
            - Cummins
            - Holset
            - Garrett
            - BorgWarner
            - Other
      - name: model
        label: Model
        type: string
      - name: oem
        label: OEM Part Number
        type: string
      - name: image
        label: Product Image
        type: image
      - name: images
        label: Product Images
        type: image
        options:
          multiple:
            max: 10
      - name: whatsapp
        label: WhatsApp Inquiry
        type: string
      - name: oem_numbers
        label: All OEM Part Numbers
        type: string
        list: true

      - name: reference_numbers
        label: Reference Numbers
        type: string
        list: true

      - name: interchange_numbers
        label: Interchange Numbers
        type: string
        list: true

      - name: engine_models
        label: Engine Models
        type: string
        list: true

      - name: applications
        label: Applications
        type: string
        list: true

      - name: origin
        label: Country of Origin
        type: string

      - name: condition
        label: Product Condition
        type: string

      - name: warranty
        label: Warranty
        type: text

      - name: description
        label: Full Product Description
        type: rich-text

      - name: technical_specs
        label: Technical Specifications
        type: object
        list: true
        fields:
          - name: parameter
            label: Parameter
            type: string
          - name: value
            label: Value
            type: string

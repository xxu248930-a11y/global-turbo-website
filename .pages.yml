
media:
  input: media
  output: /media

content:

  # 1. 品牌管理
  - name: s
    label: Brands（品牌管理）
    type: collection
    path: brands
    filename: "{primary}.json"
    format: json
    fields:
      - name: name
        label: Brand Name
        type: string
        required: true
      - name: description
        label: Brand Description
        type: text
      - name: logo
        label: Brand Logo
        type: image

  # 2. 产品分类管理
  - name: categories
    label: Categories（产品分类）
    type: collection
    path: categories
    filename: "{primary}.json"
    format: json
    fields:
      - name: name
        label: Category Name
        type: string
        required: true
      - name: description
        label: Category Description
        type: text

  # 3. 涡轮增压器及原有产品管理
  - name: products
    label: Products（Turbochargers & Parts）
    type: collection
    path: products
    filename: "{primary}.json"
    format: json
    fields:
      - name: name
        label: Product Name
        type: string
        required: true

      - name: brand
        label: Brand
        type: reference
        required: true
        options:
          collection: s

      - name: category
        label: Product Category
        type: reference
        required: true
        options:
          collection: categories

      - name: model
        label: Model
        type: string
      - name: oem
        label: OEM Part Number
        type: string
      - name: image
        label: Product Image
        type: image
      - name: images
        label: Product Images
        type: image
        options:
          multiple:
            max: 10
      - name: whatsapp
        label: WhatsApp Inquiry
        type: string
      - name: oem_numbers
        label: All OEM Part Numbers
        type: string
        list: true
      - name: reference_numbers
        label: Reference Numbers
        type: string
        list: true
      - name: interchange_numbers
        label: Interchange Numbers
        type: string
        list: true
      - name: engine_models
        label: Engine Models
        type: string
        list: true
      - name: applications
        label: Applications
        type: string
        list: true
      - name: origin
        label: Country of Origin
        type: string
      - name: condition
        label: Product Condition
        type: string
      - name: warranty
        label: Warranty
        type: text
      - name: description
        label: Full Product Description
        type: rich-text
      - name: technical_specs
        label: Technical Specifications
        type: object
        list: true
        fields:
          - name: parameter
            label: Parameter
            type: string
          - name: value
            label: Value
            type: string

  # 4. 康明斯发动机管理
  - name: cummins_products
    label: Cummins Products（康明斯发动机）
    type: collection
    path: cummins-products
    filename: "{primary}.json"
    format: json
    fields:
      - name: name
        label: Engine Product Name
        type: string
        required: true
      - name: series
        label: Engine Series
        type: string
        required: true
      - name: model
        label: Engine Model
        type: string
        required: true
      - name: oem
        label: OEM Part Number
        type: string
      - name: power
        label: Engine Power
        type: string
      - name: image
        label: Main Product Image
        type: image
      - name: images
        label: Product Images
        type: image
        options:
          multiple:
            max: 10
      - name: description
        label: Engine Description
        type: rich-text
      - name: whatsapp
        label: WhatsApp Inquiry
        type: string

  # 5. 发动机配件类别管理
  - name: engine_categories
    label: Engine Parts Categories（发动机配件类别管理）
    type: collection
    path: engine-categories
    filename: "{fields.slug}.json"
    format: json
    view:
      primary: name
      fields: [name, slug]
    fields:
      - name: name
        label: Category Name
        type: string
        required: true
      - name: slug
        label: Category Slug
        type: string
        required: true
      - name: description
        label: Category Description
        type: text
      - name: image
        label: Category Image
        type: image

  # 6. 发动机配件管理
  - name: engine_parts
    label: Engine Parts（发动机配件）
    type: collection
    path: engine-parts
    filename: "{primary}.json"
    format: json
    view:
      primary: name
      fields: [name, brand, category, model, oem]
    fields:
      - name: name
        label: Part Name
        type: string
        required: true

      - name: brand
        label: Brand
        type: string

      - name: category
        label: Engine Parts Category
        type: reference
        required: true
        options:
          collection: engine_categories
          search: "name,slug"
          value: "{path}"
          label: "{fields.name}"

      - name: model
        label: Part Model
        type: string
      - name: oem
        label: OEM Part Number
        type: string
      - name: reference_numbers
        label: Reference Numbers
        type: string
        list: true
      - name: engine_models
        label: Compatible Engine Models
        type: string
        list: true
      - name: image
        label: Main Product Image
        type: image
      - name: images
        label: Product Images
        type: image
        options:
          multiple:
            max: 10
      - name: description
        label: Part Description
        type: rich-text
      - name: whatsapp
        label: WhatsApp Inquiry
        type: string

  # 7. 工程机械类别管理
  - name: machinery_categories
    label: Machinery Categories（工程机械类别管理）
    type: collection
    path: machinery-categories
    filename: "{fields.slug}.json"
    format: json
    view:
      primary: name
      fields: [name, slug]
    fields:
      - name: name
        label: Category Name
        type: string
        required: true
      - name: slug
        label: Category Slug
        type: string
        required: true
      - name: description
        label: Category Description
        type: text
      - name: image
        label: Category Image
        type: image

  # 8. 工程机械配件管理
  - name: machinery_parts
    label: Machinery Parts（工程机械配件上传）
    type: collection
    path: machinery-parts
    filename: "{primary}.json"
    format: json
    exclude:
      - machinery-parts.html
    view:
      primary: name
      fields:
        - name
        - brand
        - category
        - oem
    fields:
      - name: name
        label: Part Name
        type: string
        required: true
      - name: brand
        label: Brand
        type: string
      - name: category
        label: Machinery Category
        type: reference
        required: true
        options:
          collection: machinery_categories
          search: "name,slug"
          value: "{path}"
          label: "{fields.name}"
      - name: machine_model
        label: Machinery Model
        type: string
      - name: oem
        label: OEM Part Number
        type: string
      - name: reference_numbers
        label: Reference Numbers
        type: string
        list: true
      - name: applications
        label: Applications
        type: string
        list: true
      - name: image
        label: Main Product Image
        type: image
      - name: images
        label: Product Images
        type: image
        options:
          multiple:
            max: 10
      - name: description
        label: Part Description
        type: rich-text
      - name: whatsapp
        label: WhatsApp Inquiry
        type: string

  # 9. 首页精选产品管理
  - name: featured_products
    label: Featured Products（首页精选产品）
    type: file
    path: featured-products.json
    format: json
    list: true
    fields:
      - name: model
        label: Product Model
        type: string
        required: true
      - name: image
        label: Product Image
        type: image
        required: true

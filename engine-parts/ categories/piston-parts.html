
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piston & Cylinder Parts | Global Engine Parts Supplier</title>
<meta name="description" content="Pistons, piston rings, cylinder liners, cylinder blocks and connecting rods for diesel engines.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6f8;color:#252a31}
header{background:#202832;color:white;padding:22px 5%}
header a{color:white;text-decoration:none;font-size:14px}
.container{max-width:1200px;margin:35px auto;padding:0 18px}
h1{font-size:30px;margin-bottom:12px}
.intro{color:#68717d;line-height:1.7;margin-bottom:25px}
.toolbar{margin-bottom:25px}
input{width:100%;max-width:420px;padding:12px;border:1px solid #ddd;border-radius:5px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:white;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.image{height:210px;background:#f0f1f3;display:flex;align-items:center;justify-content:center}
.image img{width:100%;height:100%;object-fit:cover}
.info{padding:16px}
.info h3{font-size:17px;margin-bottom:10px;line-height:1.4}
.info p{font-size:13px;color:#737b85;line-height:1.6;margin-bottom:12px}
.info a{display:inline-block;background:#e31e24;color:white;padding:10px 15px;text-decoration:none;border-radius:4px;font-size:13px}
.empty{background:white;padding:35px;text-align:center;color:#777;border-radius:8px}
</style>
</head>

<body>
<header>
<a href=" ">← Back to Engine Parts</a >
</header>

<main class="container">
<h1>Piston & Cylinder Parts</h1>
<p class="intro">
Explore our diesel engine piston and cylinder components, including pistons,
piston rings, cylinder liners, cylinder blocks and connecting rods.
</p >

<div class="toolbar">
<input id="search" type="search" placeholder="Search by product name or OEM number...">
</div>

<div id="products" class="grid">
<div class="empty">Loading products...</div>
</div>
</main>

<script>
var allProducts=[];

function getText(value){
  if(value===undefined||value===null)return "";
  if(Array.isArray(value))return value.map(getText).join(" ");
  if(typeof value==="object")return value.name||value.value||"";
  return String(value);
}

function matches(product){
  var category=getText(product.category).toLowerCase();
  var name=getText(product.name).toLowerCase();
  var text=category+" "+name;

  var keywords=[
    "piston","pistons","piston ring","piston rings",
    "cylinder liner","cylinder block","cylinder sleeve",
    "connecting rod","engine block",
    "活塞","活塞环","缸套","气缸套",
    "缸体","气缸体","连杆"
  ];

  return keywords.some(function(word){
    return text.indexOf(word)!==-1;
  });
}

function renderProducts(list){
  var container=document.getElementById("products");
  container.innerHTML="";

  if(!list.length){
    container.innerHTML='<div class="empty">No matching piston and cylinder parts found.</div>';
    return;
  }

  list.forEach(function(product){
    var name=getText(product.name)||"Unnamed Product";
    var image=getText(product.image);
    var oem=getText(product.oem);
    var description=getText(product.description).replace(/<[^>]*>/g," ").slice(0,150);

    var card=document.createElement("div");
    card.className="card";

    var imageBox=document.createElement("div");
    imageBox.className="image";

    if(image){
      var img=document.createElement("img");
      img.src=image;
      img.alt=name;
      img.loading="lazy";
      imageBox.appendChild(img);
    }else{
      imageBox.textContent="Product Image";
    }

    var info=document.createElement("div");
    info.className="info";

    var title=document.createElement("h3");
    title.textContent=name;

    var detail=document.createElement("p");
    detail.textContent=(oem?"OEM: "+oem+" | ":"")+description;

    var link=document.createElement("a");
    link.textContent="View Details";
    link.href="../../product-details.html?type=engine-part&name="+encodeURIComponent(name);

    info.appendChild(title);
    info.appendChild(detail);
    info.appendChild(link);

    card.appendChild(imageBox);
    card.appendChild(info);
    container.appendChild(card);
  });
}

fetch("../../engine-parts-index.json")
.then(function(response){
  if(!response.ok)throw new Error("Index file not found");
  return response.json();
})
.then(function(products){
  allProducts=Array.isArray(products)?products.filter(matches):[];
  renderProducts(allProducts);
})
.catch(function(error){
  console.error(error);
  document.getElementById("products").innerHTML=
    '<div class="empty">Unable to load products. Please check the product index file.</div>';
});

document.getElementById("search").addEventListener("input",function(){
  var keyword=this.value.toLowerCase();

  var filtered=allProducts.filter(function(product){
    return [
      getText(product.name),
      getText(product.oem),
      getText(product.brand)
    ].join(" ").toLowerCase().indexOf(keyword)!==-1;
  });

  renderProducts(filtered);
});
</script>
</body>
</html>

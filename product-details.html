
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Global Turbo Supplier</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --red: #ed1c24;
  --dark: #292d33;
  --muted: #858d98;
  --border: #e8e9ec;
  --light: #f7f8fa;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--dark);
  background: #fff;
}

a {
  text-decoration: none;
}

.site-header {
  padding: 15px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 12px rgba(0,0,0,.04);
}

.logo {
  color: #222;
  font-size: 19px;
  font-weight: 800;
}

.logo span {
  color: var(--red);
}

nav {
  display: flex;
  align-items: center;
  gap: 22px;
}

nav a {
  color: #444;
  font-size: 14px;
  font-weight: 600;
}

nav a:hover {
  color: var(--red);
}

.contact-link {
  background: var(--red);
  color: white;
  padding: 11px 17px;
  border-radius: 5px;
}

.breadcrumb {
  max-width: 1250px;
  margin: 25px auto;
  padding: 0 20px;
  color: var(--muted);
  font-size: 13px;
}

.breadcrumb a {
  color: #666;
}

.container {
  max-width: 1250px;
  margin: auto;
  padding: 10px 20px 60px;
}

.product-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 45px;
  align-items: start;
}

.main-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.main-image img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.gallery {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  overflow-x: auto;
}

.gallery img {
  width: 75px;
  height: 75px;
  object-fit: contain;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 5px;
  cursor: pointer;
  flex-shrink: 0;
}

.gallery img.active {
  border: 2px solid var(--red);
}

.product-brand {
  color: var(--red);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.product-title {
  font-size: 30px;
  line-height: 1.35;
  margin: 0 0 22px;
  overflow-wrap: anywhere;
}

.product-summary {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
  margin-bottom: 22px;
}

.info-row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  font-size: 14px;
  line-height: 1.5;
}

.info-label {
  width: 125px;
  flex-shrink: 0;
  color: var(--muted);
}

.info-value {
  color: #333;
  overflow-wrap: anywhere;
}

.quote-button {
  display: inline-block;
  background: var(--red);
  color: white;
  padding: 14px 25px;
  border-radius: 5px;
  font-weight: bold;
  margin-top: 10px;
}

.quote-button:hover {
  background: #c91620;
}

.section {
  margin-top: 45px;
}

.section h2 {
  font-size: 21px;
  border-left: 5px solid var(--red);
  padding-left: 12px;
  margin-bottom: 18px;
}

.description {
  padding: 22px;
  background: var(--light);
  border: 1px solid var(--border);
  border-radius: 7px;
  line-height: 1.9;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.data-list {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.data-tag {
  background: #fff3f3;
  border: 1px solid #f5dada;
  color: #a91c23;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.spec-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.spec-table td {
  padding: 13px;
  border: 1px solid var(--border);
}

.spec-table td:first-child {
  width: 35%;
  background: var(--light);
  color: #666;
}

.empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}

footer {
  padding: 28px 15px;
  text-align: center;
  background: #f7f7f7;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

@media(max-width: 750px) {
  .site-header {
    padding: 14px;
  }

  .logo {
    font-size: 16px;
  }

  nav {
    width: 100%;
    justify-content: space-between;
    gap: 7px;
  }

  nav a {
    font-size: 11px;
  }

  .contact-link {
    padding: 9px 10px;
  }

  .container {
    padding: 5px 13px 40px;
  }

  .product-layout {
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .product-title {
    font-size: 24px;
  }

  .info-label {
    width: 105px;
  }

  .section {
    margin-top: 32px;
  }

  .description {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header class="site-header">
  <a class="logo" href=" ">
    GLOBAL <span>TURBO</span> SUPPLIER
  </a >

  <nav>
    <a href="index.html">Home</a >
    <a href="turbochargers.html">Brands</a >
    <a href="all-products.html">All Products</a >
    <a class="contact-link"
       href="https://wa.me/8617377554610"
       target="_blank">Contact Us</a >
  </nav>
</header>

<div class="breadcrumb">
  <a href="index.html">Home</a > /
  <a href="turbochargers.html">Brands</a > /
  <span id="crumb-name">Product Details</span>
</div>

<main class="container" id="product-content">
  <div class="empty">Loading product details...</div>
</main>

<footer>
  <strong>GLOBAL TURBO SUPPLIER</strong><br>
  Turbochargers & Engine Parts | Worldwide Export<br>
  © Global Turbo Supplier. All Rights Reserved.
</footer>

<script>

const params = new URLSearchParams(window.location.search);
const productName = params.get("name") || "";

const content = document.getElementById("product-content");

function normalizeBrand(value) {
  return String(value || "")
    .trim()
    .replace(/\\/g, "/")
    .split("/")
    .pop()
    .replace(/\.json$/i, "");
}

function addInfoRow(container, label, value) {
  if (!value) return;

  const row = document.createElement("div");
  row.className = "info-row";

  const left = document.createElement("div");
  left.className = "info-label";
  left.textContent = label;

  const right = document.createElement("div");
  right.className = "info-value";
  right.textContent = Array.isArray(value)
    ? value.join(", ")
    : value;

  row.appendChild(left);
  row.appendChild(right);
  container.appendChild(row);
}

function addTagSection(parent, title, values) {
  if (!Array.isArray(values) || values.length === 0) return;

  const section = document.createElement("section");
  section.className = "section";

  const heading = document.createElement("h2");
  heading.textContent = title;

  const list = document.createElement("div");
  list.className = "data-list";

  values.forEach(value => {
    const tag = document.createElement("span");
    tag.className = "data-tag";
    tag.textContent = value;
    list.appendChild(tag);
  });

  section.appendChild(heading);
  section.appendChild(list);
  parent.appendChild(section);
}

function addDescription(parent, description) {
  if (!description) return;

  const section = document.createElement("section");
  section.className = "section";

  const heading = document.createElement("h2");
  heading.textContent = "Product Description";

  const text = document.createElement("div");
  text.className = "description";
  text.textContent = description;

  section.appendChild(heading);
  section.appendChild(text);
  parent.appendChild(section);
}

fetch("/products-index.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Product index not found");
    }
    return response.json();
  })
  .then(products => {

    if (!Array.isArray(products)) {
      throw new Error("Invalid product index");
    }

    const product = products.find(item =>
      String(item.name || "").trim() === productName.trim()
    );

    if (!product) {
      content.innerHTML =
        '<div class="empty">Product not found. Please return to the product list.</div>';
      return;
    }

    document.title =
      product.name + " | Global Turbo Supplier";

    document.getElementById("crumb-name").textContent =
      product.name;

    content.innerHTML = "";

    const layout = document.createElement("div");
    layout.className = "product-layout";

    /* PRODUCT IMAGES */

    const imageColumn = document.createElement("div");

    const mainImage = document.createElement("div");
    mainImage.className = "main-image";

    const img = document.createElement("img");
    img.src = product.image ||
      (Array.isArray(product.images) ? product.images[0] : "");
    img.alt = product.name || "";

    mainImage.appendChild(img);
    imageColumn.appendChild(mainImage);

    const gallery = document.createElement("div");
    gallery.className = "gallery";

    const allImages = [
      product.image,
      ...(Array.isArray(product.images) ? product.images : [])
    ].filter(Boolean);

    [...new Set(allImages)].forEach((src, index) => {

      const thumb = document.createElement("img");
      thumb.src = src;
      thumb.alt = product.name || "";
      thumb.loading = "lazy";

      if (index === 0) {
        thumb.classList.add("active");
      }

      thumb.addEventListener("click", () => {
        img.src = src;

        gallery.querySelectorAll("img").forEach(item =>
          item.classList.remove("active")
        );

        thumb.classList.add("active");
      });

      gallery.appendChild(thumb);
    });

    imageColumn.appendChild(gallery);

    /* PRODUCT INFORMATION */

    const infoColumn = document.createElement("div");

    const brand = document.createElement("div");
    brand.className = "product-brand";
    brand.textContent = normalizeBrand(product.brand);

    const title = document.createElement("h1");
    title.className = "product-title";
    title.textContent = product.name || product.model || "Product Details";

    const summary = document.createElement("div");
    summary.className = "product-summary";

    addInfoRow(summary, "Brand", normalizeBrand(product.brand));
    addInfoRow(summary, "Model", product.model);
    addInfoRow(summary, "OEM Number", product.oem);
    addInfoRow(summary, "Origin", product.origin);
    addInfoRow(summary, "Condition", product.condition);
    addInfoRow(summary, "Warranty", product.warranty);

    const quote = document.createElement("a");
    quote.className = "quote-button";
    quote.href = "https://wa.me/" +
      (product.whatsapp || "8617377554610");
    quote.target = "_blank";
    quote.rel = "noopener";
    quote.textContent = "Request a Quote";

    infoColumn.appendChild(brand);
    infoColumn.appendChild(title);
    infoColumn.appendChild(summary);
    infoColumn.appendChild(quote);

    layout.appendChild(imageColumn);
    layout.appendChild(infoColumn);

    content.appendChild(layout);

    /* PRODUCT DETAILS */

    addTagSection(content, "OEM Numbers", product.oem_numbers);
    addTagSection(content, "Reference Numbers", product.reference_numbers);
    addTagSection(content, "Interchange Numbers", product.interchange_numbers);
    addTagSection(content, "Engine Models", product.engine_models);
    addTagSection(content, "Applications", product.applications);

    /* TECHNICAL SPECIFICATIONS */

    if (Array.isArray(product.technical_specs) &&
        product.technical_specs.length > 0) {

      const section = document.createElement("section");
      section.className = "section";

      const heading = document.createElement("h2");
      heading.textContent = "Technical Specifications";

      const table = document.createElement("table");
      table.className = "spec-table";

      product.technical_specs.forEach(spec => {
        const row = document.createElement("tr");

        const parameter = document.createElement("td");
        parameter.textContent = spec.parameter || "";

        const value = document.createElement("td");
        value.textContent = spec.value || "";

        row.appendChild(parameter);
        row.appendChild(value);
        table.appendChild(row);
      });

      section.appendChild(heading);
      section.appendChild(table);
      content.appendChild(section);
    }

    addDescription(content, product.description);

  })
  .catch(error => {
    console.error("Product detail error:", error);

    content.innerHTML =
      '<div class="empty">Unable to load product details. Please try again later.</div>';
  });

</script>

</body>
</html>
